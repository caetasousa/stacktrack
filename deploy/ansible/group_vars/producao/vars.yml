---
# Variáveis não secretas do host de produção.
#
# Os segredos NÃO ficam aqui, nem ao lado: eles estão em ../../segredos/,
# cifrados, e são carregados por uma task do provisionar.yml. Neste diretório o
# Ansible carrega tudo por precedência, e um cifrado aqui passaria a exigir a
# senha do vault até para um `--syntax-check`. Gerar: `make infra-segredos`.

# Domínio público. Precisa bater EXATAMENTE com o hostname da rota do túnel no
# painel da Cloudflare (Zero Trust → Networks → Tunnels → Routes, apontando para
# http://localhost:8580): é o que faz o cookie __Host- valer, porque ele amarra
# a sessão a um host exato.
dominio: stacktrack.d4ffy.com

# --- os usuários, e o que cada um pode --------------------------------------

# Dono da aplicação: os arquivos da stack, os backups e o cron são dele, e o
# Docker rootless que roda a stack também.
usuario_app: stacktrack
grupo_app: stacktrack

# Chave PÚBLICA do OPERADOR — a sua (~/.ssh/stacktrack_servidor). É ela que
# autoriza você (e o Ansible, que entra com ela) no usuário da aplicação, com
# shell e sudo. Não é segredo: chave pública é feita para ser publicada, por
# isso fica aqui e não no vault.
#
# Par próprio do stacktrack, e de nenhum outro lugar: a anterior era a chave da
# esteira do agendaGo, reaproveitada como chave de operador — quem tivesse
# acesso ao que guardava a metade privada dela tinha sudo neste servidor.
operador_chave_publica: >-
  ssh-ed25519
  AAAAC3NzaC1lZDI1NTE5AAAAIJGCLXklZ5tnKmetteODsdPNeYaneAXayi7CtUbrtT72
  operador-stacktrack

# --- a chave de deploy -----------------------------------------------------
#
# Opcional. Para implantar sem usar a chave do operador (que abre shell), um par
# dedicado (~/.ssh/stacktrack_release): a role `usuario_app` o instala preso a
# um comando forçado que só entende três verbos (release/backup/estado). Vazia,
# o deploy é só com a chave do operador.
#
#   ssh-keygen -t ed25519 -C release-stacktrack -f ~/.ssh/stacktrack_release -N ""
#
# Sem passphrase, porque um script não digita uma — o que limita o estrago é o
# comando forçado, não a senha da chave.
chave_deploy_publica: >-
  ssh-ed25519
  AAAAC3NzaC1lZDI1NTE5AAAAIF4lB2lSjWxVtRs+2g23ff0JSNOdi7Ul8j7l7mYeYHnf
  release-stacktrack

# Chaves que NÃO podem entrar no servidor, e que a role mantém ausentes do
# authorized_keys. Trocar a chave acima não bastaria: com `exclusive: false`, a
# antiga ficaria lá, valendo.
#
# As duas são da época da esteira (GitHub Actions, removida em ago/2026): a de
# deploy teve a metade privada guardada nos segredos do repositório no GitHub,
# e a de operador era a chave da esteira do agendaGo.
chaves_revogadas:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJbDwWFfvgEOm5ILKWlDTdXmgT32NoTyKchYIM7AMGXv github-actions-agendago
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO8mNIDKQwLDbQJVreykGeb1G7luPfawEHCezTeSyHaM github-actions-stacktrack

pasta_base: /home/{{ usuario_app }}
# A stack fica na RAIZ do home, e não num `stacktrack/` dentro dele: a conta já
# é do stacktrack, e `/home/stacktrack/stacktrack` só repetiria o nome.
pasta_stack: '{{ pasta_base }}'
pasta_scripts: '{{ pasta_stack }}/scripts'
pasta_backups: '{{ pasta_base }}/backups'

# Imagens no GHCR (build e push manuais — ver docs/entrega-continua.md). O
# `stacktrack-release release <sha>` sobrescreve IMAGE_TAG no momento do deploy,
# sem tocar no .env.
imagem_repo: ghcr.io/caetasousa
imagem_tag: latest

# Usuário do GHCR para o `docker login`. O token que o acompanha é secreto e
# está no vault; só precisa de `read:packages`.
ghcr_usuario: caetasousa

# Os arquivos que a role instala no servidor vêm da RAIZ deste repositório —
# docker-compose.prod.yml e scripts/backup.sh. Copiá-los para
# roles/stacktrack/files/ criaria uma segunda cópia, que divergiria da primeira
# no dia em que alguém editasse só uma.
raiz_repo: '{{ playbook_dir }}/../..'

# --- envio de email (convites) ------------------------------------------------
#
# O provedor é o Brevo, o mesmo do agendaGo, por SMTP com STARTTLS (a API recusa
# subir em produção sem TLS). O usuário e a senha do provedor, e a chave que
# cifra a fila de emails, ficam no vault: vault_smtp_usuario, vault_smtp_senha e
# vault_email_chave. Com smtp_host vazio o envio fica desligado, e o convite sai
# só com o link manual — nada mais muda.
smtp_host: smtp-relay.brevo.com
smtp_porta: 587
# O remetente precisa estar verificado no Brevo. Um endereço @gmail.com funciona,
# mas o SPF, o DKIM e o DMARC dele são do Google: para a entrega deixar de
# depender da boa vontade do filtro de spam, o caminho é um remetente num
# domínio próprio autenticado no Brevo (ver docs/producao.md, "Email").
email_remetente: sousacaeta@gmail.com
email_remetente_nome: stacktrack

# O cron do Debian não suporta CRON_TZ — a expressão vale sempre no fuso do
# HOST, não no seu.
backup_hora: '3'
backup_minuto: '20'
