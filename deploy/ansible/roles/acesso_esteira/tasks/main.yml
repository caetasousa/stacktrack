---
# O acesso da ESTEIRA ao servidor, com o menor privilégio que ainda entrega.
#
# Antes: a esteira entrava como `deploy` — usuário com shell, no grupo `docker`
# e com a MESMA chave do agendaGo — e executava linhas de comando montadas no
# runner. Quem tivesse aquela chave tinha a máquina inteira, os dois projetos
# incluídos.
#
# Agora: usuário próprio, sem shell útil, fora do grupo `docker`, com a chave
# presa a um comando forçado que só entende `release`, `backup` e `estado`.
#
# Roda como root, em preparar-host.yml. Nada aqui está no provisionar.yml de
# propósito: um playbook que cria usuário e escreve em /etc/sudoers.d não é o
# mesmo que um que atualiza a stack, e o segundo roda com muito mais frequência.

- name: garante o usuário da esteira
  ansible.builtin.user:
    name: '{{ usuario_esteira }}'
    # NÃO entra no grupo `docker`: é o ponto da role. Acesso ao socket do Docker
    # equivale a root nesta máquina, e a esteira não precisa disso — ela precisa
    # de três verbos, que o wrapper executa como o usuário da aplicação.
    groups: []
    append: true
    # Shell de verdade, e não /usr/sbin/nologin: o comando forçado do
    # authorized_keys é executado PELO shell do usuário. Com nologin, o sshd
    # aceita a chave e recusa a sessão, e o deploy falha sem explicar por quê.
    # Quem impede o shell interativo é o `restrict` da chave, não esta linha.
    shell: /bin/bash
    home: '/home/{{ usuario_esteira }}'
    create_home: true
    state: present

- name: o wrapper de release, único comando que a chave da esteira alcança
  ansible.builtin.template:
    src: stacktrack-release.sh.j2
    dest: /usr/local/bin/stacktrack-release
    owner: root
    group: root
    # Root é dono e só root escreve. Nem a esteira nem a aplicação podem
    # reescrever o arquivo que define o que a esteira pode fazer.
    mode: '0755'
    validate: bash -n %s

# `sudo -u deploy` restrito a ESTE arquivo. Não é um furo: o que o sudo executa
# é o próprio wrapper, que valida os argumentos antes de qualquer coisa e recusa
# o que não for um dos três verbos.
- name: sudo da esteira para o usuário da aplicação, só para o wrapper
  ansible.builtin.copy:
    content: |
      # Gerado pelo Ansible (roles/acesso_esteira). Não editar no servidor.
      #
      # A esteira executa o wrapper COMO o usuário da aplicação, que é quem tem
      # acesso ao Docker. Sem senha porque não há terminal do outro lado; sem
      # curinga porque um `ALL` aqui devolveria a máquina inteira.
      {{ usuario_esteira }} ALL=({{ usuario_app }}) NOPASSWD: /usr/local/bin/stacktrack-release
    dest: /etc/sudoers.d/stacktrack-esteira
    owner: root
    group: root
    mode: '0440'
    # `visudo -cf` recusa arquivo inválido ANTES de ele existir. Sem isto, um
    # erro de sintaxe quebra o sudo do host inteiro — inclusive para quem
    # precisaria consertá-lo.
    validate: visudo -cf %s

- name: chave da esteira presa ao comando forçado
  ansible.posix.authorized_key:
    user: '{{ usuario_esteira }}'
    key: '{{ esteira_chave_publica }}'
    state: present
    # `restrict` desliga tudo o que uma chave de deploy não usa: PTY,
    # encaminhamento de porta, de agente e de X11, e o `user-rc`. O
    # `command` amarra a chave ao wrapper: o que o cliente pedir chega em
    # SSH_ORIGINAL_COMMAND e é validado lá.
    key_options: 'restrict,command="/usr/local/bin/stacktrack-release"'
    exclusive: true
  when: esteira_chave_publica | default('') | length > 0

# A role não FALHA sem a chave, ela avisa: o usuário, o wrapper e o sudo
# convergem do mesmo jeito, e a esteira continua entrando pelo caminho antigo
# até os segredos do GitHub serem trocados. Falhar aqui impediria de provisionar
# o resto do servidor por causa de um passo que é do dono do repositório.
- name: avisa que a esteira ainda não tem chave própria
  ansible.builtin.debug:
    msg: >-
      `esteira_chave_publica` está vazia: a chave da esteira NÃO foi instalada e
      o acesso de deploy continua sendo o antigo. Gere um par exclusivo
      (`ssh-keygen -t ed25519 -C github-actions-stacktrack`), ponha a pública em
      group_vars/producao/vars.yml e a privada no secret VPS_SSH_KEY.
  when: esteira_chave_publica | default('') | length == 0
