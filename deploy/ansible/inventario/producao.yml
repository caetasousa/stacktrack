---
# O servidor de produção: a distro `ubuntu-server` do WSL desta mesma máquina,
# publicada por um túnel da Cloudflare. Só fica no ar com o PC ligado e a
# distro de pé.
producao:
  hosts:
    ubuntu-server:
      # Loopback, e não um IP da rede: todas as distros do WSL2 dividem a mesma
      # rede, e o sshd do servidor escuta na 2222 para deixar a 22 livre na
      # distro de desenvolvimento.
      ansible_host: 127.0.0.1
      ansible_port: 2222

      # O usuário DONO da aplicação, NÃO root — um por projeto no servidor, cada
      # um com o seu Docker rootless.
      #
      # Nada do que `provisionar.yml` faz precisa de privilégio: os arquivos
      # moram no home dele e o Docker é o dele.
      #
      # O que exige privilégio — criar a conta, o daemon rootless, o wrapper, as
      # chaves — está em `preparar-host.yml`, que sobe por sudo. O host (pacotes
      # do Docker, sshd, cloudflared) é do `site.yml` do studygo, que montou o
      # servidor. Ver docs/infraestrutura.md.
      #
      # ⚠️ Num servidor onde esta conta ainda NÃO existe, o `preparar-host.yml`
      # precisa entrar por outra conta com sudo:
      #
      #   make infra-preparar ARGS="-e ansible_user=<conta-com-sudo> -e ansible_ssh_private_key_file=<chave>"
      ansible_user: stacktrack

      # A chave do OPERADOR. É um caminho, não um segredo. A chave de deploy tem
      # par próprio (~/.ssh/stacktrack_release) e não passa por aqui.
      ansible_ssh_private_key_file: ~/.ssh/stacktrack_servidor
