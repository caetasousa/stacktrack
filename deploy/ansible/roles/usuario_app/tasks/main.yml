---
# O usuário DONO da aplicação: os arquivos da stack, os backups e o cron são
# dele, e o Docker rootless que roda a stack também.
#
# É a ÚNICA role deste repositório que roda com privilégio, e faz só o que é a
# identidade de deploy do stacktrack: a conta, o daemon rootless dela, o sudoers
# restrito, a chave do operador, a chave de deploy e o wrapper de release. O
# host em si — os pacotes do Docker, o sshd na 2222, o cloudflared — é do
# `site.yml` do studygo, que montou o servidor.
#
# Precisa dos pacotes do modo rootless já instalados — logo, roda depois de o
# servidor estar provisionado por lá.

- name: exige a chave pública do operador
  ansible.builtin.assert:
    that:
      - operador_chave_publica is defined
      - operador_chave_publica | length > 0
    fail_msg: >-
      Defina `operador_chave_publica` em group_vars/producao/vars.yml com a
      chave PÚBLICA que você usa para entrar no servidor. Sem ela o usuário
      nasce sem acesso, e nem você nem o Ansible conseguem provisionar.

- name: garante o grupo do usuário da aplicação
  ansible.builtin.group:
    name: '{{ grupo_app }}'
    state: present

# Fora do grupo `docker`, de propósito: o daemon de sistema está desligado no
# servidor, e o grupo daria root no dia em que alguém o religasse. A stack roda
# no Docker rootless da própria conta (abaixo).
- name: garante o usuário da aplicação
  ansible.builtin.user:
    name: '{{ usuario_app }}'
    group: '{{ grupo_app }}'
    shell: /bin/bash
    home: '{{ pasta_base }}'
    create_home: true
    state: present

# A conta precisa conseguir elevar SOZINHA: o sshd do servidor tem
# `PermitRootLogin no`, e é com ela que o `make infra-preparar` entra depois da
# primeira vez. O sudo sem senha resolve isso — é o mesmo que o servidor dá a
# cada usuário de projeto (`bootstrap-wsl.sh` do studygo).
#
# A conta nasce com a senha BLOQUEADA (`passwd -S` responde `L`), o que é o
# certo para uma conta de serviço — senha de conta de serviço é senha que
# alguém guarda num arquivo. Por isso o sudo é sem senha.
#
# Quem ganha esse sudo é a chave do OPERADOR — você, que já é dono da máquina.
# A chave de deploy entra nesta mesma conta, mas presa a um comando forçado, e
# é ali que o privilégio mínimo importa.
- name: sudo do usuário da aplicação
  ansible.builtin.copy:
    content: |
      # Gerado pelo Ansible (roles/usuario_app). Não editar no servidor.
      #
      # Sem senha porque a conta não tem senha: ela é de serviço, e o acesso
      # vem por chave. Ver o comentário na role.
      {{ usuario_app }} ALL=(ALL) NOPASSWD: ALL
    dest: /etc/sudoers.d/stacktrack-{{ usuario_app }}
    owner: root
    group: root
    mode: '0440'
    # `visudo -cf` recusa arquivo inválido ANTES de ele existir. Sem isto, um
    # erro de sintaxe quebra o sudo do host inteiro — inclusive para quem
    # precisaria consertá-lo.
    validate: visudo -cf %s

- name: chave do operador no usuário da aplicação
  ansible.posix.authorized_key:
    user: '{{ usuario_app }}'
    key: '{{ operador_chave_publica }}'
    state: present
    # `exclusive: false` de propósito: se a conta já tiver outra chave
    # autorizada, esta role acrescenta a do operador sem revogar as demais. Um
    # provisionamento que tranca quem opera do lado de fora é pior do que um que
    # deixa uma chave a mais.
    exclusive: false

# --- o Docker rootless da conta ---------------------------------------------
#
# Um daemon por usuário de projeto: rede, imagens e volumes próprios. Todas as
# distros do WSL2 dividem a mesma rede, e um Docker de sistema brigaria com o
# da distro de desenvolvimento pelo docker0 e pelo iptables; o rootless roda
# numa rede própria e só publica as portas pedidas. Outro projeto no mesmo
# servidor não enxerga nem derruba este.

- name: confere os pacotes do modo rootless
  ansible.builtin.stat:
    path: /usr/share/docker.io/contrib/dockerd-rootless-setuptool.sh
  register: usuario_app_setuptool

- name: exige um servidor com o modo rootless instalado
  ansible.builtin.assert:
    that: usuario_app_setuptool.stat.exists
    fail_msg: >-
      O instalador do Docker rootless não está no servidor. Ele vem dos pacotes
      docker.io, rootlesskit, uidmap, slirp4netns e dbus-user-session, que o
      `site.yml` do studygo instala (role docker_rootless). Provisione o
      servidor por lá antes deste playbook.

# O rootless mapeia o root do container para uma faixa de uids do host. O
# `useradd` do Ubuntu reserva a faixa ao criar a conta; uma conta antiga, de
# antes do uidmap, pode ter ficado sem.
- name: confere a faixa de uids e gids do usuário
  ansible.builtin.command: grep -q '^{{ usuario_app }}:' {{ item }}
  loop:
    - /etc/subuid
    - /etc/subgid
  changed_when: false
  check_mode: false

# Sem linger, o systemd do usuário — e o daemon com ele — só vive enquanto
# houver uma sessão aberta. É o que mantém a stack no ar com ninguém logado.
- name: mantém os serviços do usuário de pé sem sessão aberta
  ansible.builtin.command: loginctl enable-linger {{ usuario_app }}
  args:
    creates: /var/lib/systemd/linger/{{ usuario_app }}

- name: descobre o uid do usuário
  ansible.builtin.command: id -u {{ usuario_app }}
  register: usuario_app_uid
  changed_when: false
  check_mode: false

# --skip-iptables: o daemon não mexe no iptables do WSL, que é compartilhado. O
# instalador termina chamando um `docker version` num caminho que o pacote do
# Ubuntu não tem — o serviço já está criado quando isso falha, e o `creates`
# é quem decide se a task rodou.
- name: instala o daemon rootless
  become: true
  become_user: '{{ usuario_app }}'
  environment:
    XDG_RUNTIME_DIR: /run/user/{{ usuario_app_uid.stdout }}
    PATH: /usr/share/docker.io/contrib:/usr/bin:/bin
  ansible.builtin.shell: dockerd-rootless-setuptool.sh install --skip-iptables || true
  args:
    creates: '{{ pasta_base }}/.config/systemd/user/docker.service'

- name: liga o daemon rootless
  become: true
  become_user: '{{ usuario_app }}'
  # Sem sessão aberta do usuário (o caso do Ansible), o systemctl --user só acha
  # o gerenciador dele pelo barramento explícito.
  environment:
    XDG_RUNTIME_DIR: /run/user/{{ usuario_app_uid.stdout }}
    DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/{{ usuario_app_uid.stdout }}/bus
  ansible.builtin.systemd:
    name: docker
    scope: user
    enabled: true
    state: started

# O cliente `docker` procura o daemon de SISTEMA por padrão. Um contexto
# corrente na config da conta faz TODO caminho achar o daemon rootless — o
# shell do operador, o comando forçado da chave de deploy, o cron do backup —
# sem cada um precisar exportar DOCKER_HOST.
- name: confere o contexto do cliente docker
  become: true
  become_user: '{{ usuario_app }}'
  ansible.builtin.command: docker context show
  register: usuario_app_contexto
  changed_when: false
  failed_when: false
  check_mode: false

- name: aponta o cliente docker para o daemon rootless
  become: true
  become_user: '{{ usuario_app }}'
  ansible.builtin.shell: |
    set -euo pipefail
    docker context inspect rootless >/dev/null 2>&1 \
      || docker context create rootless --docker host=unix:///run/user/{{ usuario_app_uid.stdout }}/docker.sock
    docker context use rootless
  args:
    executable: /bin/bash
  when: usuario_app_contexto.stdout | default('') | trim != 'rootless'
  changed_when: true

# --- a chave de deploy, na MESMA conta --------------------------------------
#
# O comando forçado é uma propriedade DA CHAVE, não do usuário: a mesma conta
# aceita a chave do operador com shell normal e a de deploy presa a um único
# programa. É o que permite implantar sem ganhar o shell da conta.
#
# O que se abre mão, e vale saber: se um dia essa linha do authorized_keys
# perder as opções, a chave de deploy passa a dar shell numa conta com sudo —
# que é root. Com uma conta separada, o mesmo erro daria um shell sem poder
# nenhum. Um desenho falha fechado, este falha aberto; a troca foi deliberada,
# para não haver duas contas e um sudo no meio.

- name: o wrapper de release, único comando que a chave de deploy alcança
  ansible.builtin.template:
    src: stacktrack-release.sh.j2
    dest: /usr/local/bin/stacktrack-release
    owner: root
    group: root
    # Root é dono e só root escreve. Nem a chave de deploy nem a aplicação podem
    # reescrever o arquivo que define o que essa chave pode fazer.
    mode: '0755'
    validate: bash -n %s

- name: chave de deploy presa ao comando forçado
  ansible.posix.authorized_key:
    user: '{{ usuario_app }}'
    key: '{{ chave_deploy_publica }}'
    state: present
    # `restrict` desliga tudo o que uma chave de deploy não usa: PTY,
    # encaminhamento de porta, de agente e de X11. O `command` a amarra ao
    # wrapper: o que o cliente pedir chega em SSH_ORIGINAL_COMMAND e é validado
    # lá dentro.
    key_options: 'restrict,command="/usr/local/bin/stacktrack-release"'
    exclusive: false
  when: chave_deploy_publica | default('') | length > 0

# Por último, depois de as chaves vigentes estarem instaladas: revogar antes
# poderia trancar do lado de fora a própria execução que está trocando a chave.
- name: chaves revogadas fora do usuário da aplicação
  ansible.posix.authorized_key:
    user: '{{ usuario_app }}'
    key: '{{ item }}'
    state: absent
  loop: '{{ chaves_revogadas | default([]) }}'
  loop_control:
    # A chave pública não é segredo, mas a linha inteira no log não ajuda
    # ninguém: o rótulo basta para saber qual foi.
    label: "{{ item.split(' ') | last }}"

- name: avisa que não há chave de deploy configurada
  ansible.builtin.debug:
    msg: >-
      `chave_deploy_publica` está vazia: a chave de deploy NÃO foi instalada
      (você continua entrando com a chave do operador). Para automatizar o
      deploy, gere um par dedicado (`ssh-keygen -t ed25519 -C deploy-stacktrack
      -f ~/.ssh/stacktrack_deploy -N ""`), ponha a pública em
      group_vars/producao/vars.yml e guarde a privada.
  when: chave_deploy_publica | default('') | length == 0
