---
# A identidade de deploy do stacktrack no host: o usuário da aplicação, o
# `sudoers` restrito, a chave do operador, a chave da esteira e o wrapper
# `stacktrack-release`.
#
#   make infra-preparar
#
# O HOST em si — Docker, rede `borda`, firewall, hardening de SSH, TLS — é do
# projeto `loadbalancer` (repo à parte), dono da borda. Este playbook pressupõe
# esse host já provisionado: precisa do grupo `docker` e de `PermitRootLogin no`
# já valendo. Rode o `site.yml` do `loadbalancer` antes.
#
# Depois dele é `provisionar.yml` que manda o dia a dia, e esse não precisa de
# privilégio nenhum.
#
# Está separado porque é a única parte que exige ROOT — e um playbook que entra
# como `stacktrack` não pode criar o `stacktrack`. É o mesmo motivo pelo qual a
# esteira nunca vai conseguir provisionar do zero: ela faz login com
# `VPS_USER=stacktrack`, que num host novo ainda não existe.
#
# O privilégio vem de `sudo`, e a senha é pedida na hora — nem o inventário nem
# o vault a guardam:
#
#   make infra-preparar
#   # equivale a:
#   cd deploy/ansible && ansible-playbook preparar-host.yml --ask-become-pass --diff
#
# Numa MÁQUINA em que o `stacktrack` ainda não consiga elevar, entre por outra
# conta com sudo — e a forma importa:
#
#   ansible-playbook preparar-host.yml -e ansible_user=<conta-com-sudo> --ask-become-pass
#
# `-e ansible_user=...`, e NÃO `-u ...`: o `-u` troca só o usuário da conexão; a
# variável `ansible_user` continua valendo `stacktrack`, vinda do inventário, e
# o `become` continuaria pedindo a senha da conta errada. O `-e` tem a
# precedência mais alta e muda as duas coisas de uma vez.
#
# Rodá-lo duas vezes seguidas tem de terminar em `changed=0` — é o que prova que
# ele descreve a máquina, e não só a constrói uma vez.

- name: Prepara a identidade de deploy do stacktrack no host
  hosts: producao
  gather_facts: true

  # Conecta como o usuário do inventário (`stacktrack`) e sobe por sudo.
  #
  # Condicional, e não `true` fixo: entrando JÁ como root, o Ansible ainda assim
  # executaria `sudo` de root para root e pediria uma senha — que numa conta de
  # serviço não existe.
  become: '{{ (ansible_user | default("")) != "root" }}'

  roles:
    - usuario_app
