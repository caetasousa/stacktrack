---
# O que exige ROOT no servidor: Docker, usuários, acesso da esteira e hardening.
#
#   make infra-preparar
#
# Depois dele é `provisionar.yml` que manda o dia a dia, e esse não precisa de
# privilégio nenhum.
#
# Está separado porque é a única parte que exige ROOT — e um playbook que entra
# como `deploy` não pode criar o `deploy`. É o mesmo motivo pelo qual a esteira
# nunca vai conseguir provisionar um servidor do zero: ela faz login com
# `VPS_USER=deploy`, que num host novo ainda não existe.
#
# A credencial de root vem do provedor do VPS e não está no inventário nem no
# vault: passe-a na hora, para ela não virar um segredo a mais para guardar.
#
#   cd deploy/ansible
#   ansible-playbook preparar-host.yml -u root --ask-pass          # senha
#   ansible-playbook preparar-host.yml -u root --key-file ~/.ssh/x # ou chave
#
# Rodá-lo duas vezes seguidas tem de terminar em `changed=0` — é o que prova que
# ele descreve a máquina, e não só a constrói uma vez.
#
# Ele deixou de ser só "dia zero": desde a A5 é também quem mantém o acesso da
# esteira (usuário próprio, wrapper, sudo restrito) e o hardening do host (SSH
# sem senha, firewall, atualização automática de segurança). Isso o torna um
# playbook que se roda de novo quando essas coisas mudam — e não uma vez na
# vida.
#
# ⚠️ Ele aperta o caminho por onde se conserta um erro dele. As duas travas que
# existem para isso recusam aplicar em vez de trancar a porta: o hardening exige
# uma chave já instalada antes de desligar a senha do SSH, e o firewall recusa
# subir quando encontra alguma porta pública fora da lista — a do vizinho,
# tipicamente. Ainda assim, tenha o console do provedor testado ANTES.

- name: Prepara a máquina para receber o stacktrack
  hosts: producao
  gather_facts: true

  # Sobrescreve o `ansible_user: deploy` do inventário. Root é o padrão aqui, e
  # `-u` na linha de comando ainda tem precedência para quem entra por outro
  # usuário administrativo.
  remote_user: root

  roles:
    # A ordem importa, e cada passo depende do anterior:
    #
    #   docker          o pacote da engine é quem cria o grupo `docker`
    #   usuario_deploy  o usuário da aplicação, que entra nesse grupo
    #   acesso_esteira  o usuário da esteira e o wrapper que ele executa COMO
    #                   o usuário da aplicação — que já precisa existir
    #   hardening       por último, porque ele desliga a senha do SSH e só pode
    #                   fazer isso depois de haver chave instalada
    - docker
    - usuario_deploy
    - acesso_esteira
    - hardening
