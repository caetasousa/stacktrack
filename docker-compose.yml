services:
  postgres:
    image: postgres:16-alpine
    container_name: stacktrack_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aplica as migrations e termina. A API só sobe depois que este container sai
  # com sucesso (service_completed_successfully), então o schema nunca fica
  # atrás do código que vai usá-lo.
  flyway:
    image: flyway/flyway:13-alpine
    container_name: stacktrack_flyway
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    volumes:
      - ./backend/migrations:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stacktrack_api
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      FRONTEND_ORIGIN: http://localhost:5173
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ANEXOS_DIR: /var/lib/stacktrack/anexos
      # Os tetos ficam FROUXOS em desenvolvimento, e é decisão, não descuido.
      #
      # A suíte E2E cria uma dúzia de contas e dispara centenas de requisições
      # em segundos: com os tetos de produção (5 cadastros/min por IP), ela
      # levaria 429 e os testes se auto-pulariam — verde sem ter exercitado
      # nada, que é o pior resultado possível para uma suíte.
      #
      # Em produção estes mesmos tetos são OBRIGATÓRIOS: config.Validar recusa
      # subir com qualquer um deles em zero. Ver .env.example.
      RATE_LIMIT_CADASTRO_POR_MINUTO: ${RATE_LIMIT_CADASTRO_POR_MINUTO:-200}
      RATE_LIMIT_LOGIN_POR_MINUTO: ${RATE_LIMIT_LOGIN_POR_MINUTO:-200}
      RATE_LIMIT_AUTENTICADO_POR_MINUTO: ${RATE_LIMIT_AUTENTICADO_POR_MINUTO:-2000}
      RATE_LIMIT_PUBLICO_POR_MINUTO: ${RATE_LIMIT_PUBLICO_POR_MINUTO:-500}
      RATE_LIMIT_SESSAO_DESCONHECIDA: ${RATE_LIMIT_SESSAO_DESCONHECIDA:-500}
      WS_HANDSHAKES_POR_MINUTO: ${WS_HANDSHAKES_POR_MINUTO:-200}
      # O email de desenvolvimento vai SEMPRE para o Mailpit, e não lê o .env
      # de propósito: a suíte E2E convida dezenas de endereços inventados por
      # execução, e com um provedor de verdade cada `make test-e2e` gastaria a
      # cota e a reputação do remetente mandando email para domínios de
      # terceiros. As mensagens ficam em http://localhost:8025.
      #
      # Sem EMAIL_CHAVE a API usa uma chave efêmera (só fora de produção): a
      # fila não sobrevive a um reinício, o que aqui não faz falta.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_STARTTLS: "false"
      EMAIL_REMETENTE: convites@stacktrack.localhost
      EMAIL_REMETENTE_NOME: stacktrack (desenvolvimento)
      # A suíte E2E reenvia convites em sequência; o intervalo de produção (2
      # minutos) a faria esperar. Zero só é aceito fora de produção.
      CONVITE_INTERVALO_REENVIO_SEG: 0
      EMAIL_INTERVALO_MS: 1000
    volumes:
      - ./backend:/app
      # Os arquivos anexados vão para um volume próprio, e NÃO para dentro de
      # ./backend: aquele diretório é a árvore de código montada do host, e
      # arquivo de usuário não pode aparecer no `git status` — nem sumir num
      # `git clean`. Volume nomeado também sobrevive ao recreate do container.
      - anexos:/var/lib/stacktrack/anexos
    depends_on:
      flyway:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  # O "provedor de email" do desenvolvimento: recebe por SMTP o que a API manda
  # e guarda, sem entregar a ninguém. UI em http://localhost:8025; a suíte E2E
  # lê as mensagens pela API dele (frontend/e2e/apoio.ts).
  #
  # Versão FIXA: a API do Mailpit é a que os testes consultam, e uma imagem
  # sem tag mudaria por baixo deles no próximo pull.
  mailpit:
    image: axllent/mailpit:v1.30.6
    container_name: stacktrack_mailpit
    ports:
      - "8025:8025" # UI web
      - "1025:1025" # SMTP

  web:
    # Mesma major do runtime que a imagem de produção vai usar (fase 8):
    # desenvolver numa versão e publicar em outra esconde incompatibilidade até
    # o deploy.
    image: node:24-alpine
    container_name: stacktrack_web
    working_dir: /app
    # `npm ci`, não `npm install`: o ci instala a partir do package-lock.json e
    # NUNCA o reescreve. Como o container roda como root e o lock está no bind
    # mount, um `npm install` aqui devolveria o arquivo ao host com dono root —
    # e a próxima instalação na sua máquina falharia com EACCES.
    # Dependência nova se adiciona no host (`npm install <pacote>`), que atualiza
    # o lock; o container só reproduz.
    command: sh -c "npm ci && npm run dev -- --host --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # node_modules e .svelte-kit em volumes PRÓPRIOS, por cima do bind mount.
      # Sem isto a instalação do container (Alpine, musl) sobrescreve a do host
      # (glibc), e os binários nativos do Vite quebram fora do container —
      # "Cannot find module './rolldown-binding.wasi.cjs'" no `make
      # test-frontend`. Os dois são gerados e ignorados pelo git; cada lado
      # passa a ter o seu.
      - frontend_node_modules:/app/node_modules
      - frontend_svelte_kit:/app/.svelte-kit
      # Cache do npm: sem ele o `npm ci` rebaixa tudo da rede a cada subida.
      - frontend_npm_cache:/root/.npm

volumes:
  postgres_data:
  anexos:
  frontend_node_modules:
  frontend_svelte_kit:
  frontend_npm_cache:
