# Stack de PRODUÇÃO. O servidor é a distro `ubuntu-server` do WSL desta máquina,
# publicada por um túnel da Cloudflare: o `cloudflared` do servidor termina o
# TLS lá fora e entrega o tráfego de `${DOMINIO}` em http://localhost:8580 —
# que é o serviço `borda` abaixo, o ÚNICO que publica porta, e só em loopback.
#
# O split front/API está na config da `borda` (fim do arquivo): /api/* vai para
# a API com o prefixo removido, todo o resto para o frontend. Origem única é o
# que faz o cookie __Host- valer e mantém a CSP em `connect-src 'self'`.
#
# Roda no Docker ROOTLESS do usuário `stacktrack`: daemon, rede, volumes e
# imagens próprios, separados dos outros projetos do servidor.
#
# Este arquivo NÃO constrói nada: as imagens vêm prontas do GHCR, publicadas à
# mão (docs/entrega-continua.md). Por isso o servidor precisa de dois arquivos
# apenas — este e o .env —, nunca do código-fonte.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

name: stacktrack

# Rotação de log: sem isto o log do Docker cresce sem limite e enche o disco —
# que é o mesmo disco da distro de desenvolvimento e dos outros projetos.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    # O entrypoint do Postgres sobe como root e larga privilégio para o usuário
    # `postgres`: por isso ele não pode ficar sem NENHUMA capability. Estas
    # cinco são o mínimo para essa troca e para ajustar o dono do datadir.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 512
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # sem `ports`: o banco só existe na rede interna deste compose.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 5

  # Job pontual: aplica as migrations e sai. A API só sobe depois que ele
  # termina com sucesso, então o schema nunca fica atrás do código.
  #
  # O Flyway é forward-only: voltar para a imagem anterior NÃO desfaz a
  # migration. É por isso que aperto de schema exige dois deploys — ver
  # CLAUDE.md, "Migration que aperta exige dois deploys".
  flyway:
    image: ${IMAGE_REPO:-ghcr.io/caetasousa}/stacktrack-migrations:${IMAGE_TAG:-latest}
    command: migrate
    logging: *logging
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      # Quem aplica migration é o DONO do banco — o usuário da aplicação não
      # tem DDL de propósito.
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_BASELINE_ON_MIGRATE: 'true'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${IMAGE_REPO:-ghcr.io/caetasousa}/stacktrack-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    # Sem `healthcheck` aqui: a imagem já traz o dela (backend/Dockerfile.prod).
    # Declarar de novo criaria duas definições para manter em sincronia.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # O binário é estático e roda sem privilégio. read_only impede que um
    # comprometimento deixe qualquer coisa gravada no container — os anexos
    # continuam graváveis porque volume montado é exceção ao read_only.
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    # Teto, não reserva. Argon2id usa ~19 MiB por hash simultâneo; suba se o log
    # mostrar OOM em rajada de login.
    mem_limit: 384m
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      # Usuário da APLICAÇÃO: só DML, sem poder criar, alterar ou derrubar
      # tabela. Sem DB_USER definido cai no dono do banco — ver docs/producao.md.
      DB_USER: ${DB_USER:-${POSTGRES_USER}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD}}
      # Ausentes, valem os padrões do projeto — que já são uma decisão, ao
      # contrário do padrão do pgx (max(4, núcleos), ou seja 4 numa VPS de 1 vCPU).
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
      # É esta variável que liga o prefixo __Host- e o atributo Secure no cookie
      # de sessão. Sem HTTPS de verdade na frente, o navegador descarta o cookie
      # e o login não completa.
      APP_ENV: production
      FRONTEND_ORIGIN: https://${DOMINIO}
      ANEXOS_DIR: /var/lib/stacktrack/anexos
      # De onde a API aceita o cabeçalho X-Real-IP: a sub-rede da rede `borda`
      # (fim do arquivo), onde só estão a borda, a API e o front. O Postgres
      # fica de fora dela.
      #
      # É a variável que decide se o IP do cliente é confiável, e portanto se
      # os tetos por IP valem alguma coisa: vinda de qualquer outro lugar, a
      # requisição escolheria o próprio balde de rate limit. Com a lista vazia
      # a API recusa subir em produção (config.Validar) — de propósito, porque
      # o modo "não confia em ninguém" jogaria todos os clientes no balde do
      # IP do proxy e a primeira rajada trancaria todo mundo para fora.
      PROXIES_CONFIAVEIS: 10.89.0.0/24
      # O envio de email dos convites. Com SMTP_HOST vazio o envio fica
      # desligado e o convite sai só com o link manual — nada mais muda. A
      # senha do provedor e a chave que cifra a fila vêm do vault, pelo .env.
      # config.Validar recusa subir com SMTP sem TLS ou sem a chave.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      EMAIL_REMETENTE: ${EMAIL_REMETENTE:-}
      EMAIL_REMETENTE_NOME: ${EMAIL_REMETENTE_NOME:-stacktrack}
      EMAIL_CHAVE: ${EMAIL_CHAVE:-}
    volumes:
      - anexos:/var/lib/stacktrack/anexos
    # Participa das duas redes: a interna (para falar com o Postgres) e a
    # `borda` (por onde o nginx da borda a alcança).
    networks:
      - default
      - borda
    depends_on:
      flyway:
        condition: service_completed_successfully

  # A imagem já vem com PUBLIC_API_URL=/api assado no build — relativo, e
  # portanto independente do domínio.
  web:
    image: ${IMAGE_REPO:-ghcr.io/caetasousa}/stacktrack-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    mem_limit: 256m
    environment:
      # adapter-node atrás de proxy: conhece a origem pública e confia nos
      # cabeçalhos X-Forwarded-* que a borda escreve. Sem isto ele só enxerga o
      # IP do container e recusa requisições por origem inválida.
      ORIGIN: https://${DOMINIO}
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
    # Só a `borda`: o front não fala com o Postgres, nem com a API pelo servidor
    # — quem chama a API é o navegador, por /api.
    networks:
      - borda
    depends_on:
      - api

  # A borda: o único serviço que publica porta, e só em loopback. O túnel da
  # Cloudflare (rota de `${DOMINIO}` → http://localhost:8580) é o único cliente
  # previsto; o WSL em modo NAT não expõe a porta na rede local.
  #
  # nginx, e não Traefik: atrás do túnel, o IP do visitante chega no cabeçalho
  # CF-Connecting-IP, e o Traefik preencheria o X-Real-IP com o IP do próprio
  # cloudflared — todo mundo num balde só do rate limit.
  borda:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    restart: unless-stopped
    logging: *logging
    # Sem `read_only`, e é a única exceção da stack: o Compose recusa `configs`
    # com `content` num serviço read_only. O que compensa: roda como usuário sem
    # privilégio (a imagem é a `unprivileged`), sem capability nenhuma.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 64m
    ports:
      - '127.0.0.1:8580:8080'
    networks:
      - borda
    configs:
      - source: borda_nginx
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - web
      - api

configs:
  # A config da borda mora AQUI, e não num arquivo ao lado: o roteamento fica
  # num lugar só, que o `stacktrack-release sync` também consegue entregar.
  #
  # O Compose interpola `$` neste texto: toda variável do nginx vai como `$$`.
  # A sub-rede 10.89.0.0/24 é a da rede `borda`, logo abaixo — as três
  # ocorrências (aqui, a rede e o PROXIES_CONFIAVEIS da API) andam juntas.
  borda_nginx:
    content: |
      map $$http_upgrade $$connection_upgrade {
        default upgrade;
        ''      close;
      }

      # O access log não guarda os tokens de convite e de link público: nesses
      # caminhos o segmento depois do prefixo É a credencial, e o link do
      # convite agora viaja por email. Vai ao log trocado por [redigido] — e o
      # Referer fica de fora, porque ele repetiria a mesma URL.
      map $$request_uri $$requisicao_redigida {
        default $$request_uri;
        "~^(?<prefixo>/(?:api/)?(?:convite|convites|publico))/[^/?]+(?<resto>.*)$$" "$$prefixo/[redigido]$$resto";
      }
      log_format redigido '$$remote_addr - [$$time_local] "$$request_method $$requisicao_redigida $$server_protocol" '
                          '$$status $$body_bytes_sent "$$http_user_agent"';

      server {
        listen 8080;
        server_tokens off;
        access_log /dev/stdout redigido;
        # O log de ERRO repete a requisição inteira e o Referer — com o token
        # dentro —, e o formato dele não se configura. Ele só a escreve em
        # falha de upstream (nível error), que é o que acontece num release,
        # com api e web parados. Daí `crit`: o 502 continua no access log, já
        # redigido, e o token não vai para lugar nenhum.
        error_log /dev/stderr crit;

        # O teto da API é 11 MiB (anexo + envelope multipart). Um pouco acima
        # aqui, para que quem responda o 413 seja a API, com a mensagem dela.
        client_max_body_size 12m;

        # O IP do visitante vem do cabeçalho da Cloudflare, e só é aceito de
        # quem entra pela porta publicada — que chega pelo gateway da rede
        # `borda`, dentro desta sub-rede.
        set_real_ip_from 10.89.0.0/24;
        real_ip_header CF-Connecting-IP;

        # Upstream por variável + resolver do Docker: o nginx resolve o nome a
        # cada 10 s, em vez de guardar o IP do boot. Sem isto, todo release (que
        # recria api e web) deixaria a borda apontando para containers mortos.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $$api http://api:8080;
        set $$web http://web:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $$host;
        proxy_set_header X-Real-IP $$remote_addr;
        proxy_set_header X-Forwarded-For $$remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $$host;

        # /api/* na MESMA origem que o front, com o prefixo removido — é o que
        # faz o cookie __Host- valer e a CSP em `connect-src 'self'`. O /ws
        # passa por aqui, por isso o Upgrade e o timeout longo.
        location /api/ {
          rewrite ^/api(/.*)$$ $$1 break;
          proxy_pass $$api;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$connection_upgrade;
          proxy_read_timeout 1h;
        }

        # Os cabeçalhos de segurança vão na resposta do front. A CSP NÃO: quem
        # a emite é o SvelteKit, que sabe o hash dos próprios scripts.
        location / {
          proxy_pass $$web;
          add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
          add_header X-Content-Type-Options nosniff always;
          add_header X-Frame-Options DENY always;
          add_header Referrer-Policy no-referrer always;
          add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
          add_header Cross-Origin-Opener-Policy same-origin always;
        }
      }

networks:
  # Da borda para a API e o front. Sub-rede fixa porque é ela que a API e o
  # nginx usam como lista de confiança do IP do cliente. Não colide com nada:
  # o Docker rootless tem rede própria, separada da do WSL e dos outros
  # projetos do servidor.
  borda:
    ipam:
      config:
        - subnet: 10.89.0.0/24

volumes:
  postgres_data:
  # Os anexos são arquivos no disco, não linhas no banco: o pg_dump NÃO os
  # inclui. Este volume precisa de backup próprio — ver scripts/backup.sh.
  anexos:
