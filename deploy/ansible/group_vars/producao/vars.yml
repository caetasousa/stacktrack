---
# Variáveis não secretas do host de produção.
#
# Os segredos NÃO ficam aqui, nem ao lado: eles estão em ../../segredos/,
# cifrados, e são carregados por uma task do provisionar.yml. Neste diretório o
# Ansible carrega tudo por precedência, e um cifrado aqui passaria a exigir a
# senha do vault até para um `--syntax-check`. Gerar: `make infra-segredos`.

# Domínio público. Precisa bater EXATAMENTE com o server_name do bloco do
# stacktrack no nginx do projeto `loadbalancer`: é o que faz o cookie __Host-
# valer, porque ele amarra a sessão a um host exato.
dominio: stacktrack.caetasousa.tech

# --- os usuários, e o que cada um pode --------------------------------------

# Dono da aplicação: os arquivos da stack, os backups e o cron são dele, e é ele
# quem fala com o Docker. Estar no grupo `docker` equivale a root nesta máquina
# — é inerente a quem opera containers.
usuario_app: stacktrack
grupo_app: stacktrack

# Chave PÚBLICA do OPERADOR — a sua. É ela que autoriza você (e o Ansible, que
# entra com ela) no usuário da aplicação. Não é segredo: chave pública é feita
# para ser publicada, por isso fica aqui e não no vault.
#
# O que NÃO se reaproveita é a chave de DEPLOY, que tem par próprio
# (`esteira_chave_publica`, abaixo — nome herdado).
operador_chave_publica: >-
  ssh-ed25519
  AAAAC3NzaC1lZDI1NTE5AAAAIJbDwWFfvgEOm5ILKWlDTdXmgT32NoTyKchYIM7AMGXv
  github-actions-agendago

# --- a chave de deploy -----------------------------------------------------
#
# Opcional. Se você quiser implantar de um script ou de outra máquina sem dar a
# chave do operador (que abre shell), gere um par dedicado e ponha a pública
# aqui: a role `usuario_app` a instala presa a um comando forçado que só entende
# quatro verbos (sync/release/backup/estado). Vazia, o deploy é só com a chave
# do operador.
#
#   ssh-keygen -t ed25519 -C deploy-stacktrack -f ~/.ssh/stacktrack_deploy -N ""
#
# A pública vai aqui; guarde a privada. Sem passphrase, porque um script não
# digita uma — o que limita o estrago é o comando forçado, não a senha da chave.
esteira_chave_publica: >-
  ssh-ed25519
  AAAAC3NzaC1lZDI1NTE5AAAAIO8mNIDKQwLDbQJVreykGeb1G7luPfawEHCezTeSyHaM
  deploy-stacktrack

pasta_base: /home/{{ usuario_app }}
# A stack fica na RAIZ do home, e não num `stacktrack/` dentro dele: a conta já
# é do stacktrack, e `/home/stacktrack/stacktrack` só repetiria o nome.
pasta_stack: '{{ pasta_base }}'
pasta_scripts: '{{ pasta_stack }}/scripts'
pasta_backups: '{{ pasta_base }}/backups'

# Imagens no GHCR (build e push manuais — ver docs/entrega-continua.md). O
# `stacktrack-release release <sha>` sobrescreve IMAGE_TAG no momento do deploy,
# sem tocar no .env.
imagem_repo: ghcr.io/caetasousa
imagem_tag: latest

# Usuário do GHCR para o `docker login`. O token que o acompanha é secreto e
# está no vault; só precisa de `read:packages`.
ghcr_usuario: caetasousa

# Os arquivos que a role instala no servidor vêm da RAIZ deste repositório —
# docker-compose.prod.yml e scripts/backup.sh. Copiá-los para
# roles/stacktrack/files/ criaria uma segunda cópia, que divergiria da primeira
# no dia em que alguém editasse só uma.
raiz_repo: '{{ playbook_dir }}/../..'

# Rede Docker compartilhada com o nginx do `loadbalancer`. Declarada `external`
# no compose, o que significa que o Compose NÃO a cria: quem a garante é o
# playbook do `loadbalancer`, dono da borda.
rede_borda: borda

# O cron do Debian não suporta CRON_TZ — a expressão vale sempre no fuso do
# HOST, não no seu.
backup_hora: '3'
backup_minuto: '20'
