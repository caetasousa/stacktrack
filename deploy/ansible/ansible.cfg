# Configuração do Ansible deste repositório.
#
# Todos os caminhos abaixo são relativos a `deploy/ansible/`, então os comandos
# precisam rodar a partir daqui — é o que os alvos `infra-*` do Makefile fazem.

[defaults]
inventory = inventario/producao.yml
roles_path = roles
collections_path = .collections

# `vault_password_file` NÃO está aqui, e a ausência é deliberada.
#
# Declarada nesta configuração, ela vale para TODO comando ansible rodado neste
# diretório — e um arquivo de senha ausente derruba o comando na partida, antes
# de qualquer análise. Isso impediria um `make infra-validar` (sintaxe + lint)
# numa máquina que não tem a senha dos segredos de produção.
#
# Quem precisa da senha a passa explicitamente, e os alvos `infra-*` do Makefile
# já o fazem — ver a variável SENHA_VAULT lá. É o mesmo princípio do
# `vars_files` de provisionar.yml: o segredo entra onde é usado, não no ambiente
# inteiro.

# Saída em YAML: o diff de um template sai legível linha a linha, em vez de um
# blob JSON escapado numa linha só. O `--check --diff` é o critério de aceite
# desta fase, então ele precisa ser lido por gente.
#
# Pelo callback PADRÃO com `result_format`, e não pelo `stdout_callback = yaml`:
# aquele vem do community.general, está depreciado desde o ansible-core 2.13 e
# some na versão 12 da coleção — que é a que um `ansible-galaxy install` numa
# máquina nova baixaria.
stdout_callback = default
result_format = yaml

# Sem isto o Ansible avisa, a cada task, sobre a descoberta do interpretador
# Python do alvo — ruído que esconde o que interessa no --diff.
interpreter_python = auto_silent

# O host precisa estar no known_hosts. Desligar seria aceitar a identidade de
# quem responder naquele endereço e entregar a senha do vault junto.
host_key_checking = True

# Cache dos fatos do host. O playbook roda contra uma máquina só, e recoletá-los
# a cada execução custa mais do que todas as tasks somadas.
fact_caching = jsonfile
fact_caching_connection = .fatos
fact_caching_timeout = 3600

[ssh_connection]
# Reusa uma conexão TCP para todas as tasks, em vez de abrir uma por task.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
