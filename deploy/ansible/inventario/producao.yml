---
# O VPS de produção — uma máquina só, dividida com o agendaGo.
producao:
  hosts:
    srv1856874:
      # O mesmo nome que o DNS já aponta para o VPS, e que a esteira usa no
      # `curl` de verificação pós-deploy. Um IP fixo aqui seria uma segunda
      # fonte da verdade para "onde fica o servidor", que passaria a divergir do
      # DNS no dia da troca de máquina.
      ansible_host: stacktrack.duckdns.org

      # O usuário da aplicação, NÃO root.
      #
      # Nada do que `provisionar.yml` faz precisa de privilégio: os arquivos
      # moram no home do `deploy` e o acesso ao Docker vem do grupo. É o mesmo
      # usuário e o mesmo poder que o job `implantar` da esteira já usa.
      #
      # O que exige root — instalar o Docker, criar este usuário — está em
      # `preparar-host.yml`, que roda uma vez por MÁQUINA e pede a credencial de
      # root explicitamente. Ver docs/infraestrutura.md.
      ansible_user: deploy

      # A mesma chave de deploy do agendaGo, como previsto em docs/producao.md.
      # É um caminho, não um segredo: o par privado dela também é o secret
      # VPS_SSH_KEY do GitHub.
      ansible_ssh_private_key_file: ~/.ssh/agendago_deploy
