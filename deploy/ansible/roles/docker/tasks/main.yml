---
# Docker Engine, plugin do Compose e a rede compartilhada com o Caddy do
# agendaGo.
#
# Esta role NÃO atualiza o Docker. Um `apt upgrade` do docker-ce reinicia o
# daemon, e no reinício TODOS os containers do agendaGo — que divide esta
# máquina — caem junto. Atualizar a engine é decisão consciente, não efeito
# colateral de um provisionamento: use `--tags docker-upgrade` quando for a hora.

- name: verifica se o Docker já está instalado
  ansible.builtin.command: docker --version
  register: docker_instalado
  changed_when: false
  failed_when: false
  # Sem isto a task seria pulada em --check e todas as que dependem dela
  # decidiriam com uma variável indefinida.
  check_mode: false

- name: instala o Docker a partir do repositório oficial
  when: docker_instalado.rc != 0
  block:
    - name: dependências para falar com o repositório apt do Docker
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: diretório das chaves de repositório
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: chave de assinatura do Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    # A distribuição sai dos fatos em vez de ser fixada: o repositório do Docker
    # tem caminhos distintos para Debian e Ubuntu, e chutar um deles quebraria o
    # provisionamento num VPS que não fosse o de hoje.
    - name: repositório apt do Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}
          {{ ansible_facts.distribution_release }} stable
        filename: docker
        state: present

    - name: engine, CLI e plugin do Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: o serviço do Docker sobe junto com a máquina
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

# A rede `borda` é declarada `external` no docker-compose.prod.yml, e external
# significa que o Compose NÃO a cria: ele falha com "network borda declared as
# external, but could not be found". Ela vive fora do ciclo de vida de qualquer
# stack — um `docker network prune` numa faxina a levaria embora e deixaria os
# DOIS projetos quebrados sem nada explicando o que restaurar.
#
# Feito por `command` e não por community.docker.docker_network de propósito: o
# módulo exige o SDK do Docker para Python instalado NO SERVIDOR, e uma
# dependência a mais num host compartilhado custa mais do que estas duas tasks.
- name: verifica se a rede compartilhada do Caddy existe
  ansible.builtin.command: docker network inspect {{ rede_borda }}
  register: docker_rede_existente
  changed_when: false
  failed_when: false
  check_mode: false

- name: cria a rede compartilhada do Caddy
  ansible.builtin.command: docker network create {{ rede_borda }}
  when: docker_rede_existente.rc != 0
  changed_when: true
