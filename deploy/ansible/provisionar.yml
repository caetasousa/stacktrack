---
# Leva o servidor de "sem stacktrack nenhum" a "aplicação no ar".
#
#   make infra-check     mostra o que mudaria
#   make infra-apply     aplica
#
# O playbook DECLARA estado, não executa um roteiro: cada task descreve o que
# deve ser verdade. O que já existe é reconhecido e reportado como `ok`; o que
# falta é criado. É por isso que ele serve igual para o servidor recém-limpo e
# para o que já está montado — e é por isso que rodá-lo duas vezes seguidas tem
# de terminar em `changed=0`.
#
# Conecta como `stacktrack` e NÃO usa sudo em lugar nenhum: tudo mora no home
# dele e o acesso ao Docker vem do grupo. É o mesmo privilégio que a esteira já
# tem, o que significa que este playbook não amplia o raio de explosão de nada.
#
# O que exige root — criar o usuário, o wrapper, as chaves — está em
# `preparar-host.yml`. O host em si (Docker, rede `borda`, firewall, TLS) é do
# projeto `loadbalancer`.
#
# O que ele deliberadamente NÃO faz: escrever qualquer coisa de nginx (o
# roteamento é do `loadbalancer`), reescrever o crontab inteiro ou remover a
# rede `borda`.

- name: Provisiona a stack do stacktrack
  hosts: producao
  gather_facts: true


  # Pré-requisitos que este playbook não pode criar sozinho, conferidos ANTES de
  # qualquer escrita. Sem isto, a ausência do Docker só apareceria no fim, na
  # task que sobe a stack, com uma mensagem sobre o binário e não sobre a causa.
  pre_tasks:
    # O vault entra AQUI, numa task, e não em group_vars/ nem em `vars_files`.
    #
    # Em group_vars/producao/ o Ansible o decifra ao montar as variáveis de
    # QUALQUER playbook que aponte para este grupo — inclusive o
    # preparar-host.yml, que não usa segredo nenhum. E tanto group_vars quanto
    # `vars_files` são resolvidos antes de a play rodar, o que fazia até um
    # `--syntax-check` exigir a senha do vault. Era o que impedia o CI de validar
    # este diretório sem receber a chave dos segredos de produção.
    #
    # `include_vars` é uma TASK: só abre o arquivo quando a play executa de
    # verdade. Quem analisa o playbook não toca no cifrado; quem provisiona
    # precisa da senha, como sempre precisou.
    - name: carrega os segredos de produção
      ansible.builtin.include_vars: segredos/producao.yml
      # O módulo devolve no resultado tudo o que carregou — e o que ele carregou
      # é a senha do banco.
      no_log: true

    - name: confere se o host já foi preparado
      ansible.builtin.command: docker compose version
      register: docker_pronto
      changed_when: false
      failed_when: false
      check_mode: false

    - name: exige um host preparado
      ansible.builtin.assert:
        that: docker_pronto.rc == 0
        fail_msg: >-
          O Docker ou o plugin do Compose não respondem como {{ ansible_user }}.
          Este playbook não instala nenhum dos dois: o Docker é do projeto
          `loadbalancer` (dono da borda) e o usuário `{{ ansible_user }}` sai do
          `make infra-preparar`. Provisione o host pelo `loadbalancer` e rode o
          `make infra-preparar` antes deste.

  roles:
    - stacktrack
